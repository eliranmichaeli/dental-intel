<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>DentalIntel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #ddd8f8; font-family: Arial, Helvetica, sans-serif; font-size: 15px; min-height: 100vh; }

    /* Header */
    header { background: #0c0c1a; border-bottom: 1px solid #1a1a38; padding: 14px 24px; position: sticky; top: 0; z-index: 10; }
    .hrow { max-width: 860px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo span { font-size: 26px; }
    .logo-name { font-size: 18px; font-weight: 700; color: #c0aaff; }
    .logo-sub { font-size: 11px; color: #55557a; }
    .hright { display: flex; align-items: center; gap: 10px; }
    #last-run { font-size: 12px; color: #444470; background: #0e0e22; padding: 3px 10px; border-radius: 5px; display: none; }
    .logout { padding: 5px 12px; border: 1px solid #222244; border-radius: 6px; background: none; color: #666688; font-size: 12px; cursor: pointer; font-family: inherit; }

    /* Main */
    main { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }

    /* Focus buttons */
    .section-label { font-size: 12px; color: #666688; font-weight: 600; margin-bottom: 10px; letter-spacing: 0.5px; }
    .focus-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .fbtn {
      padding: 7px 15px; border-radius: 18px;
      border: 1px solid #1e1e3a; background: #0e0e1c;
      color: #7070a0; font-size: 13px; cursor: pointer;
      font-family: inherit; transition: all 0.12s;
    }
    .fbtn:hover { border-color: #4030a0; color: #a090e0; }
    .fbtn.active { background: #1a0e40; border-color: #6040c0; color: #c0aaff; font-weight: 700; }

    /* Run button */
    #run-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #3828a0, #5a38c0);
      border: none; border-radius: 10px;
      color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 18px rgba(70,40,190,0.35);
    }
    #run-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Status */
    #status { display: none; align-items: center; gap: 10px; color: #666688; font-size: 13px; padding: 12px 0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #5030b0; box-shadow: 0 0 8px #5030b0; animation: pulse 1.1s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Error */
    #error-box { display: none; background: #160808; border: 1px solid #3a1010; border-radius: 8px; padding: 12px 16px; color: #ff6b6b; font-size: 13px; margin-top: 12px; }

    /* Empty */
    #empty { text-align: center; margin-top: 70px; }
    #empty .eicon { font-size: 52px; margin-bottom: 14px; }
    #empty .etitle { font-size: 18px; color: #44447a; font-weight: 700; margin-bottom: 8px; }
    #empty .esub { font-size: 13px; color: #333360; line-height: 1.7; }

    /* Report */
    #report-wrap { display: none; margin-top: 16px; }
    .act-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .act-btn { padding: 7px 14px; background: #0e0e1c; border: 1px solid #1e1e3a; border-radius: 7px; color: #7070a0; font-size: 13px; cursor: pointer; font-family: inherit; }
    .act-btn:hover { color: #c0aaff; border-color: #4030a0; }
    #report-body {
      background: #0c0c1a; border: 1px solid #1a1a38;
      border-radius: 12px; padding: 26px 28px;
      line-height: 1.85; color: #b8b0d8;
    }
    #report-body h1 { font-size: 19px; color: #c0aaff; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #1a1a38; }
    #report-body h2 { font-size: 15px; color: #9880d8; margin: 22px 0 8px; }
    #report-body h3 { font-size: 14px; color: #7868b8; margin: 14px 0 6px; }
    #report-body strong { color: #ccc4f0; }
    #report-body hr { border: none; border-top: 1px solid #1a1a38; margin: 18px 0; }
    #report-body br { display: block; content: ''; margin: 2px 0; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.25); border-top-color: #fff; border-radius: 50%; animation: spin 0.75s linear infinite; vertical-align: middle; margin-left: 8px; }
  </style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">
      <span>🦷</span>
      <div>
        <div class="logo-name">DentalIntel</div>
        <div class="logo-sub">סוכן מודיעין עסקי · שוק ישראלי</div>
      </div>
    </div>
    <div class="hright">
      <span id="last-run"></span>
      <button class="logout" onclick="doLogout()">יציאה</button>
    </div>
  </div>
</header>

<main>
  <p class="section-label">בחר מיקוד הדוח</p>
  <div class="focus-row">
    <button class="fbtn active" data-id="all">📋 דוח מלא</button>
    <button class="fbtn" data-id="trends">📈 טרנדים</button>
    <button class="fbtn" data-id="prices">💰 מחירים ומבצעים</button>
    <button class="fbtn" data-id="competitors">🏆 מתחרים</button>
    <button class="fbtn" data-id="opportunities">🚀 הזדמנויות</button>
    <button class="fbtn" data-id="branding">💬 מיתוג וסלוגנים</button>
  </div>

  <button id="run-btn" onclick="generateReport()">▶ הפק דוח עכשיו</button>

  <div id="status">
    <span class="dot"></span>
    מחפש ברשת · מנתח מידע · מדרג ממצאים · מייצר תובנות
  </div>

  <div id="error-box"></div>

  <div id="empty">
    <div class="eicon">📡</div>
    <div class="etitle">הסוכן מוכן לסריקה</div>
    <div class="esub">בחר מיקוד ולחץ על הכפתור<br>לקבלת דוח מודיעין בזמן אמת</div>
  </div>

  <div id="report-wrap">
    <div class="act-row">
      <button class="act-btn" onclick="copyReport()">📋 העתק דוח</button>
      <button class="act-btn" onclick="window.print()">🖨 הדפס</button>
    </div>
    <div id="report-body"></div>
  </div>
</main>

<script>
  const PROMPTS = {
    all: "הפק דוח מודיעין יומי מלא על שוק רפואת השיניים והרפואה האסתטית בישראל. חפש מידע עדכני על טרנדים, מחירים, מתחרים, סלוגנים והזדמנויות.",
    trends: "חפש ברשת טרנדים חדשים בשוק רפואת השיניים האסתטית בישראל. דרג אותם ותן ציונים.",
    prices: "חפש ברשת מחירים עדכניים לטיפולי שיניים ורפואה אסתטית בישראל. זהה מבצעים, חבילות ומסלולי VIP.",
    competitors: "עקוב אחר פעילות מתחרים בשוק רפואת השיניים האסתטית בישראל. זהה שינויים משמעותיים.",
    opportunities: "זהה הזדמנויות עסקיות בשוק רפואת השיניים בישראל שעדיין לא אומצו. חפש רעיונות מחוץ לארץ.",
    branding: "חפש סלוגנים ורעיונות שיווקיים ממרפאות שיניים ורפואה אסתטית בישראל. נתח מה עובד ומדוע.",
  };

  let focus = "all";
  let reportText = "";

  document.querySelectorAll(".fbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".fbtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      focus = btn.dataset.id;
    });
  });

  async function generateReport() {
    const runBtn = document.getElementById("run-btn");
    const status = document.getElementById("status");
    const errBox = document.getElementById("error-box");
    const empty = document.getElementById("empty");
    const wrap = document.getElementById("report-wrap");

    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="spinner"></span> סורק את השוק...';
    status.style.display = "flex";
    errBox.style.display = "none";
    wrap.style.display = "none";
    empty.style.display = "none";

    try {
      const res = await fetch("/.netlify/functions/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ prompt: PROMPTS[focus] }),
      });

      if (res.status === 401) {
        window.location.href = "/index.html";
        return;
      }

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "שגיאה " + res.status);
      }

      reportText = data.report;
      document.getElementById("report-body").innerHTML = renderReport(reportText);
      wrap.style.display = "block";
      wrap.scrollIntoView({ behavior: "smooth", block: "start" });

      const lr = document.getElementById("last-run");
      lr.textContent = "עדכון: " + new Date().toLocaleTimeString("he-IL");
      lr.style.display = "inline";

    } catch (err) {
      errBox.textContent = "שגיאה: " + err.message;
      errBox.style.display = "block";
      empty.style.display = "block";
    } finally {
      runBtn.disabled = false;
      runBtn.textContent = "▶ הפק דוח עכשיו";
      status.style.display = "none";
    }
  }

  function renderReport(text) {
    const escaped = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    return escaped
      .replace(/^# (.+)$/gm, "<h1>$1</h1>")
      .replace(/^## (.+)$/gm, "<h2>$1</h2>")
      .replace(/^### (.+)$/gm, "<h3>$1</h3>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^---+$/gm, "<hr>")
      .replace(/\n/g, "<br>");
  }

  function copyReport() {
    if (!reportText) return;
    navigator.clipboard.writeText(reportText).then(() => {
      const btn = event.currentTarget;
      const orig = btn.textContent;
      btn.textContent = "✓ הועתק!";
      setTimeout(() => btn.textContent = orig, 2000);
    });
  }

  async function doLogout() {
    await fetch("/.netlify/functions/logout", { method: "POST", credentials: "same-origin" });
    window.location.href = "/index.html";
  }
</script>
</body>
</html>
