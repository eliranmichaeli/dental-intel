<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>DentalIntel — כניסה</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      background: #0e0e1c;
      border: 1px solid #1e1e3a;
      border-radius: 16px;
      padding: 48px 40px;
      width: 340px;
      text-align: center;
    }
    .icon { font-size: 44px; margin-bottom: 14px; }
    h1 { color: #c8b8ff; font-size: 26px; margin-bottom: 4px; }
    .sub { color: #55557a; font-size: 12px; margin-bottom: 30px; }
    input[type="password"] {
      width: 100%;
      padding: 13px 14px;
      background: #111122;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e0deff;
      font-size: 15px;
      text-align: right;
      outline: none;
      margin-bottom: 10px;
      font-family: inherit;
    }
    input[type="password"]:focus { border-color: #5040b0; }
    .error { color: #ff6b6b; font-size: 13px; height: 18px; margin-bottom: 8px; }
    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3828a0, #5a38c0);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🦷</div>
    <h1>DentalIntel</h1>
    <p class="sub">סוכן מודיעין עסקי · שוק ישראלי</p>
    <input type="password" id="pw" placeholder="סיסמה" autofocus>
    <div class="error" id="err"></div>
    <button id="btn" onclick="doLogin()">כניסה</button>
  </div>
  <script>
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const pw = document.getElementById('pw').value.trim();
      const err = document.getElementById('err');
      const btn = document.getElementById('btn');
      if (!pw) { err.textContent = 'הכנס סיסמה'; return; }

      btn.disabled = true;
      btn.textContent = 'מתחבר...';
      err.textContent = '';

      try {
        const res = await fetch('/.netlify/functions/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
          credentials: 'same-origin'
        });
        if (res.ok) {
          window.location.href = '/dashboard.html';
        } else {
          err.textContent = 'סיסמה שגויה';
          btn.disabled = false;
          btn.textContent = 'כניסה';
        }
      } catch {
        err.textContent = 'שגיאת חיבור';
        btn.disabled = false;
        btn.textContent = 'כניסה';
      }
    }
  </script>
</body>
</html>
